<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configurações básicas de codificação e responsividade para dispositivos móveis -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Oficial | Vitor Nascimento dos Santos</title>

    <!-- Importação de Fontes do Google Fonts (Philosopher para títulos, Inter para textos e Share Tech Mono para código/logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* ========================================================== */
        /* 1. VARIÁVEIS CSS & CONFIGURAÇÃO BASE (DARK NEON MODE)       */
        /* ========================================================== */
        :root {
            --bg-color: #0d0e15;                 /* Fundo escuro principal */
            --text-color: #e2e8f0;               /* Cor principal do texto */
            --text-muted: #94a3b8;               /* Cor secundária/atenuada para parágrafos */
            --header-bg: #13121f;                /* Fundo do cabeçalho fixo */
            --header-border: #8a2be2;            /* Cor da borda e destaque roxo neon */
            --nav-link: #3b82f6;                 /* Cor dos links de navegação */
            --nav-hover: #ffffff;                /* Cor do link ao passar o rato/clicar */
            --h1-color: #00f5d4;                 /* Cor principal de destaque (Ciano Neon) */
            --h2-color: #ffd166;                 /* Cor secundária de destaque (Amarelo Neon) */
            --card-bg: #161525;                  /* Fundo dos cartões de conteúdo */
            --card-border: #2d2448;              /* Borda sutil dos cartões */
            --badge-bg: rgba(0, 245, 212, 0.08); /* Fundo translúcido para badges de skills */
            --badge-color: #00f5d4;              /* Texto dos badges de skills */
            --badge-border: #00f5d4;             /* Borda dos badges de skills */
            --input-bg: rgba(255, 255, 255, 0.03);/* Fundo dos campos do formulário */
            --input-border: #8a2be2;             /* Borda dos campos do formulário */
            --btn-bg: #8a2be2;                   /* Fundo dos botões principais */
            --btn-text: #ffffff;                 /* Texto dos botões principais */
            --project-title-color: #ff5c8a;      /* Cor exclusiva rosa/coral neon para títulos de projetos */
        }

        /* ========================================================== */
        /* 2. CONFIGURAÇÃO DO MODO CLARO (LIGHT THEME)                */
        /* ========================================================== */
        html.claro {
            --bg-color: #f4f2ee;
            --text-color: #2b2d42;
            --text-muted: #5c677d;
            --header-bg: #e5e0d3;
            --header-border: #7c3aed;
            --nav-link: #2563eb;
            --nav-hover: #1e1b4b;
            --h1-color: #005f73;
            --h2-color: #ca6702;
            --card-bg: #ffffff;
            --card-border: #dcd6cb;
            --badge-bg: #e0f2fe;
            --badge-color: #0369a1;
            --badge-border: #0284c7;
            --input-bg: #ffffff;
            --input-border: #7c3aed;
            --btn-bg: #7c3aed;
            --btn-text: #ffffff;
            --project-title-color: #c9184a;
        }

        /* ========================================================== */
        /* 3. RESET GLOBAL E ESTILOS DE ESTRUTURA                     */
        /* ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: transparent;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: 86px; /* Espaço reservado para o cabeçalho fixo */
            transition: color 0.3s ease;
        }

        /* ========================================================== */
        /* 4. CABEÇALHO E BARRA DE NAVEGAÇÃO FIXA                     */
        /* ========================================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--header-bg);
            border-bottom: 2px solid var(--header-border);
            box-shadow: 0 4px 20px rgba(138, 43, 226, 0.35);
            z-index: 1000;
        }

        .logo {
            color: var(--header-border);
            font-weight: bold;
            margin: 0;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
            cursor: pointer;
            font-size: 1.25rem;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            position: relative;
            text-decoration: none;
            color: var(--nav-link);
            font-weight: 600;
            font-size: 1.05rem;
            padding-bottom: 6px;
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
            transition: color 0.3s ease, text-shadow 0.3s ease;
            cursor: pointer;
        }

        /* Efeito de linha deslizante animada sob os links do menu */
        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 2px;
            background-color: #00f5d4;
            box-shadow: 0 0 10px #00f5d4;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav a:hover::after, 
        nav a.ativo::after {
            width: 100%;
        }

        nav a:hover, 
        nav a.ativo {
            color: var(--nav-hover) !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 15px #00f5d4 !important;
        }

        /* Botão de alternância de tema */
        #tema {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            background-color: var(--header-bg);
            color: var(--text-color);
            border: 2px solid var(--header-border);
            box-shadow: 0 0 12px rgba(138, 43, 226, 0.25);
            transition: all 0.3s ease;
        }

        #tema:hover {
            background-color: var(--header-border);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
        }

        /* ========================================================== */
        /* 5. CONTEÚDO PRINCIPAL E SISTEMA DE ABAS (SPA)              */
        /* ========================================================== */
        main {
            padding: 2.5rem 2rem;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .view {
            display: none; /* Oculta todas as páginas/visões por padrão */
            animation: fadeIn 0.3s ease-in-out;
        }

        .view.active {
            display: block; /* Exibe apenas a página ativa */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--h1-color);
            font-size: 2.2rem;
            margin-bottom: 16px;
            font-family: 'Philosopher', serif;
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.25);
        }

        h2 {
            color: var(--h2-color);
            font-size: 1.4rem;
            margin-bottom: 12px;
            font-family: 'Philosopher', serif;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.6;
            font-size: 1.05rem;
        }

        /* ========================================================== */
        /* 6. CARTÕES (CARDS) E COMPONENTES                           */
        /* ========================================================== */
        .card {
            background-color: var(--card-bg);
            padding: 26px;
            margin-bottom: 22px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #8a2be2;
            box-shadow: 0 0 22px rgba(138, 43, 226, 0.45);
        }

        /* Estilização da foto de perfil na aba Sobre */
        .foto-perfil {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--header-border);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
            margin-bottom: 20px;
        }

        /* Grelha de Habilidades (Hard e Soft Skills) */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .skill-item {
            background-color: var(--badge-bg);
            color: var(--badge-color);
            border: 1px solid var(--badge-border);
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ========================================================== */
        /* 7. BADGES E LINKS DE CONTATO DIRETO                        */
        /* ========================================================== */
        .badges-contato {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .badge-contato {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .badge-contato svg {
            width: 20px;
            height: 20px;
            fill: var(--h1-color);
            transition: transform 0.3s;
        }

        .badge-contato:hover {
            border-color: #00f5d4;
            color: #00f5d4;
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(0, 245, 212, 0.4);
        }

        .badge-contato:hover svg {
            transform: scale(1.1);
        }

        /* ========================================================== */
        /* 8. GRELHA DE PROJETOS                                      */
        /* ========================================================== */
        .projetos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .projeto-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            padding: 24px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .projeto-card:hover {
            transform: translateY(-6px);
            border-color: #8a2be2;
            box-shadow: 0 0 22px rgba(138, 43, 226, 0.45);
        }

        .projeto-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 245, 212, 0.1);
            border-radius: 10px;
            color: var(--h1-color);
        }

        .projeto-card h3 {
            color: var(--project-title-color); /* Título personalizado em tom rosa/coral neon */
            font-size: 1.25rem;
            font-family: 'Philosopher', serif;
        }

        .projeto-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 4px 0;
        }

        .tag {
            background: rgba(138, 43, 226, 0.15);
            color: var(--h2-color);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .projeto-link {
            color: var(--nav-link);
            font-size: 0.95rem;
            font-weight: bold;
            text-decoration: none;
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .projeto-link:hover {
            color: var(--h1-color);
            text-decoration: underline;
        }

        /* ========================================================== */
        /* 9. FORMULÁRIO DE CONTATO                                   */
        /* ========================================================== */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 580px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
